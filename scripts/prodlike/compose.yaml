# Mājas Palīgs — LOCAL production-like stack (BRAIN/docs/PRODLIKE.md). Mirrors the Coolify deployment:
#   browser ──https──► proxy (Caddy, `tls internal`, stands in for Traefik) ──http──► web (nginx → php-fpm)
#   web / worker / scheduler / migrate = the PRODUCTION services, extended from docker/compose.prod.yaml unchanged
#   (same image target, same env names, APP_ENV=production, DB_SSLMODE=require, Redis AUTH, LOG_CHANNEL=stderr).
#   pgsql = Postgres 18 with SSL ON (self-signed cert) and hostssl-only pg_hba, bootstrapped with database/sql/roles.sql
#   exactly like production (NOCREATEDB, one `majas` database); redis = requirepass; mailpit catches all mail.
#
# Never run this file by hand without the generated env file — use the wrappers:
#   scripts/prodlike/up.sh | down.sh | dc.sh <compose args> | browser.sh [node script]
# Secrets live in storage/app/prodlike/prodlike.env (git-ignored, generated once by up.sh).
name: majas-prodlike

x-local: &local
  # The locally built prod image (majas-paligs:prodlike); never pulled from a registry.
  pull_policy: never

services:
  # ---- production app services (docker/compose.prod.yaml) -------------------------------------------------------
  migrate:
    extends: { file: ../../docker/compose.prod.yaml, service: migrate }
    <<: *local
    # Coolify-only key (keeps the one-shot out of Coolify's health check); plain docker compose rejects it.
    exclude_from_hc: !reset null
    depends_on:
      pgsql: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    extends: { file: ../../docker/compose.prod.yaml, service: web }
    <<: *local
    environment:
      # Production does not pass MAJAS_PUBLIC_HOST (default kaimini.coredigify.com == the APP_URL host). Here the
      # public host is the proxy, so invite letters / QR codes point at this stack.
      MAJAS_PUBLIC_HOST: ${MAJAS_PUBLIC_HOST:-localhost:8443}

  worker:
    extends: { file: ../../docker/compose.prod.yaml, service: worker }
    <<: *local
    environment:
      MAJAS_PUBLIC_HOST: ${MAJAS_PUBLIC_HOST:-localhost:8443}

  scheduler:
    extends: { file: ../../docker/compose.prod.yaml, service: scheduler }
    <<: *local
    environment:
      MAJAS_PUBLIC_HOST: ${MAJAS_PUBLIC_HOST:-localhost:8443}

  # ---- reverse proxy (Traefik stand-in) ----------------------------------------------------------------------------
  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "8443:8443"   # fixed: APP_URL, the Caddyfile site and __Host- cookies all use :8443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_started }
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---- managed resources (separate Coolify resources in production) ----------------------------------------------
  # One-shot: self-signed server certificate for Postgres (the postgres image has no openssl binary; the app image has).
  pgsql-cert:
    image: ${MAJAS_IMAGE:-majas-paligs:prodlike}
    <<: *local
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -s /certs/server.key ] && [ -s /certs/server.crt ] ||
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj /CN=pgsql
        -keyout /certs/server.key -out /certs/server.crt 2>/dev/null;
        chown 70:70 /certs/server.key /certs/server.crt && chmod 600 /certs/server.key && chmod 644 /certs/server.crt
    volumes:
      - pgsql-certs:/certs
    restart: "no"
    logging: *logging

  pgsql:
    image: postgres:18.6-alpine
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run scripts/prodlike/up.sh}
      MAJAS_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      MAJAS_APP_PASSWORD: ${DB_PASSWORD}
      MAJAS_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD}
    volumes:
      - pgsql:/var/lib/postgresql
      - pgsql-certs:/certs:ro
      - ../../database/sql:/majas-sql:ro
      - ./pg-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      pgsql-cert: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d majas"]
      interval: 3s
      timeout: 3s
      retries: 40
    logging: *logging

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${PRODLIKE_MAILPIT_PORT:-8036}:8025"
    logging: *logging

  # ---- real browser (profile "browser") ---------------------------------------------------------------------------
  # Playwright Chromium from the dev `browser` image. It shares the proxy's network namespace, so INSIDE it
  # https://localhost:8443 is the very same origin a tester's browser uses (cookies, __Host- prefix, APP_URL).
  browser:
    image: majas-paligs-browser:local
    pull_policy: never
    profiles: ["browser"]
    network_mode: "service:proxy"
    working_dir: /var/www/html
    entrypoint: ["sh", "-c"]
    command: ["node scripts/prodlike/smoke.mjs"]
    environment:
      BASE_URL: https://localhost:8443
      MAILPIT_URL: http://mailpit:8025
      PRODLIKE_DIR: /var/www/html/storage/app/prodlike
    volumes:
      - ../..:/var/www/html
      # Same Linux node_modules volume as the dev `browser` service (scripts/dev.sh browser).
      - node_modules_browser:/var/www/html/node_modules
    depends_on:
      proxy: { condition: service_started }
    logging: *logging

volumes:
  private-storage:
  pgsql:
  pgsql-certs:
  caddy-data:
  caddy-config:
  # Shared with the dev stack (compose.yaml `browser`); browser.sh creates it when missing.
  node_modules_browser:
    name: majas-paligs_node_modules_browser
    external: true
