# Mājas Palīgs prodlike — TLS-only network access (a non-TLS client is rejected, like a managed Postgres with
# "SSL required"). Local socket = the image's init scripts and `psql` inside the container.
# TYPE    DATABASE  USER  ADDRESS       METHOD
local     all       all                 trust
hostssl   all       all   0.0.0.0/0     scram-sha-256
hostssl   all       all   ::/0          scram-sha-256
hostnossl all       all   0.0.0.0/0     reject
hostnossl all       all   ::/0          reject
