# Mājas Palīgs CI (MVP-SPEC A.3, ADR 0002): a red main never deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres-ci
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Personal-data guard (DOC/ never tracked, no phone numbers, no real plates in docs)
        # The self-test proves the patterns still fire (WhatsApp "+371 NN NNN NNN", landlines, plates) before the scan.
        run: sh scripts/personal-data-guard.sh --self-test && sh scripts/personal-data-guard.sh

      - name: VERSION changed (pull requests)
        if: github.event_name == 'pull_request'
        run: git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qx VERSION || (echo "Bump VERSION"; exit 1)

      - name: Bootstrap roles (same roles.sql as production)
        run: |
          for db in majas majas_test; do
            psql -v ON_ERROR_STOP=1 -d postgres -v dbname=$db -v owner_password=owner-dev-only \
              -v app_password=app-dev-only -v retention_password=retention-dev-only -v owner_createdb=CREATEDB \
              -f database/sql/roles.sql
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, gd, exif, bcmath, sodium, zip, pcntl, sockets
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Pest (PostgreSQL majas_test, migrated as majas_owner)
        run: vendor/bin/pest

      - name: Fresh-cluster bootstrap check (AC 20)
        run: sh scripts/bootstrap-check.sh
        env:
          DB_OWNER_PASSWORD: owner-dev-only

      - name: Composer audit
        run: composer audit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci + build
        run: npm ci && npm run build

      - name: npm audit
        run: npm audit --omit=dev

      - name: Lang key parity (lv vs ru)
        run: node scripts/lang-parity.mjs

      - name: Docker build (prod target)
        run: docker build --target prod -t majas-paligs:ci .

  # Real browser (MVP-SPEC A.12 / B.8 / C.8 Browser/* + A.11 AC 16 layout sweep): pest-plugin-browser drives
  # Playwright Chromium against the real Vite build; e-mail codes go through a real Mailpit.
  browser:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres-ci
      DB_HOST: 127.0.0.1
      MAILPIT_URL: http://127.0.0.1:8025
      MAILPIT_SMTP_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap roles
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -v dbname=majas_test -v owner_password=owner-dev-only             -v app_password=app-dev-only -v retention_password=retention-dev-only -v owner_createdb=CREATEDB             -f database/sql/roles.sql

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, gd, exif, bcmath, sodium, zip, pcntl, sockets
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci + build + Playwright Chromium (version pinned in package.json)
        run: npm ci && npm run build && npx playwright install --with-deps chromium

      - name: Pest browser suite
        run: vendor/bin/pest --testsuite=Browser

      - name: "Screenshots (review: 320px / senior / 200 %, colour-blind simulation)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  # ADR 0002: the image that passed the tests is the image that runs. A green main builds the prod target once and
  # pushes it to GHCR as :<VERSION>, :sha-<commit> (immutable, for rollback) and :main (the tag Coolify pulls).
  image:
    needs: [test, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/majas-paligs"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "tags=${ref}:$(cat VERSION),${ref}:sha-${GITHUB_SHA::12},${ref}:main" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy (pulls ${{ needs.image.outputs.ref }}:main — only after a green main)
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_WEBHOOK }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
