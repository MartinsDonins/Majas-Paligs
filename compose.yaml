# Mājas Palīgs — local development stack (MVP-SPEC A.2). Production uses docker/compose.prod.yaml on Coolify.
# Start with: scripts/dev.sh up && scripts/dev.sh init
name: majas-paligs

x-app: &app
  build:
    context: .
    target: dev
    args:
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  image: majas-paligs-dev:local
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    PHP_OPCACHE_ENABLE: "0"
    SSL_MODE: "off"
    AUTORUN_ENABLED: "false"
    SHOW_WELCOME_MESSAGE: "false"
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_started
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8080}:8080"

  horizon:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    profiles: ["workers"]

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    profiles: ["workers"]

  vite:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_POLLING: ${VITE_POLLING:-1}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - vendor:/app/vendor:ro
    profiles: ["assets"]
    logging: *logging

  pgsql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres-dev-only}
      MAJAS_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-owner-dev-only}
      MAJAS_APP_PASSWORD: ${DB_PASSWORD:-app-dev-only}
      MAJAS_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD:-retention-dev-only}
    ports:
      - "${PG_PORT:-54329}:5432"
    volumes:
      - pgsql:/var/lib/postgresql
      - ./database/sql:/majas-sql:ro
      - ./docker/pgsql/00-bootstrap.sh:/docker-entrypoint-initdb.d/00-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d majas"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *logging

  redis:
    image: redis:8-alpine
    logging: *logging

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    logging: *logging

volumes:
  vendor:
  node_modules:
  pgsql:
