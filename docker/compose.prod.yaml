# Mājas Palīgs — Coolify "Docker Compose" resource (MVP-SPEC A.2). One image, four services.
# Postgres 18 and Redis 8 are separate Coolify resources. Each service gets ONLY its own DB credentials:
#   migrate   → DB_OWNER_*   (majas_owner, one-shot)
#   web/worker→ DB_*         (majas_app)
#   scheduler → DB_* + DB_RETENTION_* (prune commands only)
# Shared env (set in Coolify): APP_KEY, APP_PREVIOUS_KEYS, APP_URL, INVITE_KEY, PLATE_ENC_KEY, PLATE_INDEX_KEY,
# CONTACT_ENC_KEY, CONTACT_INDEX_KEY (resident roster, SEC-011 — required before the first roster import),
# DB_HOST, DB_PORT, DB_DATABASE, REDIS_HOST, MAIL_*, SENTRY_LARAVEL_DSN, PLATFORM_ALERT_EMAIL.
name: majas-paligs

# Image (ADR 0002): CI pushes the tested prod image to GHCR as :<VERSION>, :sha-<commit> and :main. Coolify pulls
# :main on the deploy webhook; to roll back set MAJAS_IMAGE to an immutable tag (…:0.0.12 or …:sha-<commit>).
# The GHCR package is private → add the registry credentials on the Coolify server (MANUAL-TODO).
x-app: &app
  image: ${MAJAS_IMAGE:-ghcr.io/martinsdonins/majas-paligs:main}
  pull_policy: always
  environment: &env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:-https://kaimini.coredigify.com}
    APP_TIMEZONE: UTC
    APP_KEY: ${APP_KEY}
    APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
    INVITE_KEY: ${INVITE_KEY}
    PLATE_ENC_KEY: ${PLATE_ENC_KEY}
    PLATE_INDEX_KEY: ${PLATE_INDEX_KEY}
    PLATE_ENC_KEY_PREVIOUS: ${PLATE_ENC_KEY_PREVIOUS:-}
    CONTACT_ENC_KEY: ${CONTACT_ENC_KEY:-}
    CONTACT_INDEX_KEY: ${CONTACT_INDEX_KEY:-}
    CONTACT_ENC_KEY_PREVIOUS: ${CONTACT_ENC_KEY_PREVIOUS:-}
    SESSION_DRIVER: redis
    SESSION_COOKIE: __Host-mp_session
    SESSION_SECURE_COOKIE: "true"
    # Session payload encrypted with APP_KEY (holds the auth id, step-up freshness, the pending TOTP secret).
    SESSION_ENCRYPT: "true"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: ${REDIS_HOST}
    # Redis AUTH is mandatory (sessions, limiters, PIN pause, TOTP replay markers); the app refuses to boot without it
    # (App\Support\ProductionGuard). Keep Redis on the private Coolify network only; TLS if it is on another host.
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    DB_CONNECTION: pgsql
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-5432}
    DB_DATABASE: ${DB_DATABASE:-majas}
    # No TLS downgrade: require (or verify-full with the CA mounted); ProductionGuard refuses disable/allow/prefer.
    DB_SSLMODE: ${DB_SSLMODE:-require}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
    PLATFORM_ALERT_EMAIL: ${PLATFORM_ALERT_EMAIL:-}
    LOG_CHANNEL: stderr
    # nginx realip (serversideup trusted-proxy/local.conf): X-Forwarded-For from the Docker / private ranges only,
    # walked right-to-left (real_ip_recursive) → the first untrusted address = the visitor, written by Coolify's
    # Traefik → REMOTE_ADDR. Production has NO Cloudflare in front: with `cloudflare` here every visitor was the
    # Traefik container (172.28.0.x) and shared one bucket in every IP limiter (QA 2026-10-20). If Cloudflare is ever
    # put in front (orange cloud), switch to `cloudflare` (CF-Connecting-IP) and lock the origin to Cloudflare IPs.
    # Laravel trusts proxies for the scheme only, never for the IP (bootstrap/app.php).
    # Smoke test after deploy: curl https://<host>/up/ip from a known client must show THAT client's prefix.
    TRUSTED_PROXY: local
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *app
    command: ["php", "/var/www/html/artisan", "migrate", "--database=pgsql_owner", "--force", "--isolated", "--no-interaction"]
    restart: "no"
    environment:
      <<: *env
      DB_OWNER_USERNAME: majas_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
    exclude_from_hc: true

  web:
    <<: *app
    environment:
      <<: *env
      DB_USERNAME: majas_app
      DB_PASSWORD: ${DB_PASSWORD}
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
    volumes:
      - private-storage:/var/www/html/storage/app/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["php", "/var/www/html/artisan", "horizon"]
    environment:
      <<: *env
      DB_USERNAME: majas_app
      DB_PASSWORD: ${DB_PASSWORD}
      AUTORUN_ENABLED: "false"
    volumes:
      - private-storage:/var/www/html/storage/app/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *env
      DB_USERNAME: majas_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_RETENTION_USERNAME: majas_retention
      DB_RETENTION_PASSWORD: ${DB_RETENTION_PASSWORD}
      AUTORUN_ENABLED: "false"
    volumes:
      - private-storage:/var/www/html/storage/app/private
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]

volumes:
  private-storage:
