##
# Mājas Palīgs security configuration (replaces serversideup security.conf).
# The application adds CSP, Permissions-Policy, COOP and X-App-Version in App\Http\Middleware\SecurityHeaders.
# The four headers below must also cover static files, so nginx owns them for EVERY response. add_header never
# replaces an upstream header, so PHP-FPM's copies are hidden first: each header is sent exactly once
# (production sent Strict-Transport-Security twice, round 3). tests/Feature/Security/SecurityHeadersOnceTest.php
# keeps every add_header paired with its fastcgi_hide_header.
# add_header_inherit merge (nginx >= 1.29.3; the image ships 1.30): the base image's asset and font locations set
# their own Cache-Control / CORS add_header, which used to DROP these four headers from every static file.
##
add_header_inherit merge;

fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header Strict-Transport-Security;

add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Block hidden files except /.well-known/ (RFC 8615)
location ~ /\.(?!well-known) {
    deny all;
}

# Block files that may expose sensitive information
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
