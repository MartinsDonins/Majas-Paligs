##
# Mājas Palīgs security configuration (replaces serversideup security.conf).
# The application adds CSP, Permissions-Policy and HSTS in App\Http\Middleware\SecurityHeaders;
# nginx repeats the headers that must also cover static files.
##
add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Block hidden files except /.well-known/ (RFC 8615)
location ~ /\.(?!well-known) {
    deny all;
}

# Block files that may expose sensitive information
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
